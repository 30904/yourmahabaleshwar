version: '3.8'

# Local / staging stack
# Usage: docker compose up -d --build

services:
  mongodb:
    image: mongo:7
    container_name: yourmahabaleshwar-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: yourmahabaleshwar

  redis:
    image: redis:7-alpine
    container_name: yourmahabaleshwar-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yourmahabaleshwar-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - ./backend/.env
    environment:
      # Override host Mongo when running inside Compose network
      MONGODB_URI: mongodb://mongodb:27017/yourmahabaleshwar
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: '1'
    depends_on:
      - mongodb
      - redis
    volumes:
      - uploads_data:/app/src/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: yourmahabaleshwar-web
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
  uploads_data:
