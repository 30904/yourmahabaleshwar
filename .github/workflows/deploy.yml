name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/deploy-backend.sh"
      - "scripts/deploy-frontend.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: do-deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — deploy backend and frontend"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "No previous commit — deploy backend and frontend"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "$AFTER" || true)"
          echo "Changed files:"
          echo "$CHANGED"

          BACKEND=false
          FRONTEND=false
          if echo "$CHANGED" | grep -qE '^(backend/|scripts/deploy-backend\.sh|\.github/workflows/deploy\.yml)'; then
            BACKEND=true
          fi
          if echo "$CHANGED" | grep -qE '^(frontend/|scripts/deploy-frontend\.sh|\.github/workflows/deploy\.yml)'; then
            FRONTEND=true
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "backend=$BACKEND frontend=$FRONTEND"

  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (build gate)
        run: npm ci --prefix backend

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DO_SSH_PORT }}" -H "${{ secrets.DO_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy backend (rsync + remote reload)
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
          DO_SSH_PORT: ${{ secrets.DO_SSH_PORT }}
          DO_DEPLOY_PATH: ${{ secrets.DO_DEPLOY_PATH }}
          DO_SSH_KEY_PATH: /home/runner/.ssh/deploy_key
        run: bash scripts/deploy-backend.sh

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  deploy-frontend:
    needs: [changes, deploy-backend]
    # always() is required: when backend is skipped (frontend-only push),
    # GitHub would otherwise skip this job without evaluating the if.
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Configure production env for the build
        # VITE_API_URL is same-origin (/api) because nginx proxies /api/ to
        # the backend on the same domain — not sensitive, so it's fine to
        # bake in directly rather than storing it as a secret.
        run: printf 'VITE_API_URL=/api\nVITE_SITE_URL=https://www.yourmahabaleshwar.com\n' > frontend/.env.production

      - name: Build
        run: npm run build --prefix frontend

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DO_SSH_PORT }}" -H "${{ secrets.DO_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy frontend (rsync dist/ + reload nginx)
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
          DO_SSH_PORT: ${{ secrets.DO_SSH_PORT }}
          DO_DEPLOY_PATH: ${{ secrets.DO_DEPLOY_PATH }}
          DO_SSH_KEY_PATH: /home/runner/.ssh/deploy_key
        run: bash scripts/deploy-frontend.sh

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
