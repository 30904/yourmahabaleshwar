version: '3.8'

# Production: https://www.yourmahabaleshwar.com
#
# 1. cp backend/.env.production.example backend/.env  → fill secrets
# 2. docker compose -f docker-compose.prod.yml up -d --build
# 3. Point DNS A/AAAA for www (+ apex) to this server
# 4. Enable TLS via deploy/nginx-host.conf + certbot (or Cloudflare Full/Strict)

services:
  mongodb:
    image: mongo:7
    restart: always
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: yourmahabaleshwar

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/yourmahabaleshwar
      CLIENT_URL: https://www.yourmahabaleshwar.com,https://yourmahabaleshwar.com
      PUBLIC_API_URL: https://www.yourmahabaleshwar.com
      TRUST_PROXY: '1'
      RATE_LIMIT_MAX: '100'
    depends_on:
      - mongodb
    volumes:
      - uploads_data:/app/src/uploads
    expose:
      - '5000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SITE_URL: https://www.yourmahabaleshwar.com
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Host nginx (deploy/nginx-host.conf) proxies 443 → 8080
      - '8080:80'

volumes:
  mongo_data:
  uploads_data:
