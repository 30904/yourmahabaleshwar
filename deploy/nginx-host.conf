# Host / VPS nginx in front of Docker (TLS + apex → www)
# Place under /etc/nginx/sites-available/yourmahabaleshwar
# Requires certbot certificates for www + apex.

# Apex → www
server {
    listen 80;
    listen [::]:80;
    server_name yourmahabaleshwar.com;
    return 301 https://www.yourmahabaleshwar.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourmahabaleshwar.com;

    ssl_certificate     /etc/letsencrypt/live/yourmahabaleshwar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourmahabaleshwar.com/privkey.pem;

    return 301 https://www.yourmahabaleshwar.com$request_uri;
}

# WWW (HTTP → HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name www.yourmahabaleshwar.com;
    return 301 https://www.yourmahabaleshwar.com$request_uri;
}

# WWW HTTPS → Docker frontend (port 80 on host from docker-compose.prod)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yourmahabaleshwar.com;

    ssl_certificate     /etc/letsencrypt/live/yourmahabaleshwar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourmahabaleshwar.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
